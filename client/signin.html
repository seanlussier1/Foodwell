<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foodwell | Sign in</title><link rel="stylesheet" href="styles.css"><script defer src="auth.js"></script><script defer src="signin.js"></script></head>
<body data-page="signin"><main><div class="intro"><p class="eyebrow">YOUR ACCOUNT</p><h1>Welcome back.</h1><p>Sign in to manage your cart or access your workspace.</p></div><section class="panel signin-panel"><h2 id="signin-heading">Sign in</h2><p id="signin-status" class="muted" role="status" aria-live="polite"></p><form id="signin-form"><label>Email<input id="signin-email" type="email" autocomplete="username" required></label><label>Password<input id="signin-password" type="password" autocomplete="current-password" required></label><details class="connection"><summary>API connection</summary><label>API base URL<input id="signin-api" type="url" required></label></details><button type="submit">Sign in</button></form><p id="register-prompt">New to Foodwell? <a id="go-register" href="./?page=register" target="_top">Create an account</a></p><button id="signout" type="button" class="secondary" hidden>Sign out</button></section></main></body></html>
