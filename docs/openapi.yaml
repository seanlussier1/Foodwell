openapi: 3.0.3
info:
  title: Foodwell API
  version: 1.0.0-build1
  description: >
    A RESTful API for an online grocery store (420-511-VA Web Services).


    **Build 1 status:** only `GET /products` and `GET /products/{id}` are
    implemented. Every other operation is tagged `planned`
    (`x-status: planned`) and is documented as the target contract for
    Build 2 or Build 3; it does not work yet.
servers:
  - url: http://localhost/foodwell-api/api/v1
    description: WampServer (Apache, www/foodwell-api)
  - url: http://localhost:8080/api/v1
    description: PHP built-in server (composer start)
tags:
  - name: implemented
    description: Working in Build 1
  - name: planned
    description: Contract only - not implemented yet (Build 2 / Build 3)

paths:
  /products:
    get:
      tags: [implemented]
      x-status: implemented
      summary: Get the list of products
      description: >
        Returns every product from the database, wrapped in a `data` envelope.
        No filtering, sorting or pagination in Build 1. When there are no
        products the response is still `200` with `{"data": []}`.
      responses:
        '200':
          description: The product list (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
              examples:
                populated:
                  summary: Seeded database
                  value:
                    data:
                      - id: 101
                        name: Whole Milk 2L
                        price: 4.99
                        unit: each
                        stock: 42
                        categoryId: 2
                        categoryName: Dairy
                        imageUrl: https://example.com/images/whole-milk.jpg
                      - id: 104
                        name: Gala Apples
                        price: 2.99
                        unit: lb
                        stock: 120
                        categoryId: 1
                        categoryName: Produce
                        imageUrl: https://example.com/images/gala-apples.jpg
                empty:
                  summary: No products in the database
                  value:
                    data: []
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [planned]
      x-status: planned
      summary: Add a new product (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product data

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [implemented]
      x-status: implemented
      summary: Get one product by ID
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 101
                name: Whole Milk 2L
                price: 4.99
                unit: each
                stock: 42
                categoryId: 2
                categoryName: Dairy
                imageUrl: https://example.com/images/whole-milk.jpg
        '404':
          description: No product with that ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 404
                  message: Product 999999 not found.
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [planned]
      x-status: planned
      summary: Replace a product's details (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
        '404':
          description: Product not found
    delete:
      tags: [planned]
      x-status: planned
      summary: Delete a product (Build 2)
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found

  /categories:
    get:
      tags: [planned]
      x-status: planned
      summary: Get all categories (Build 2)
      responses:
        '200':
          description: A JSON array of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [planned]
      x-status: planned
      summary: Add a category (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created

  /categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags: [planned]
      x-status: planned
      summary: Get one category (Build 2)
      responses:
        '200':
          description: A single category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
    delete:
      tags: [planned]
      x-status: planned
      summary: Delete a category (Build 2)
      responses:
        '204':
          description: Category deleted
        '404':
          description: Category not found

  /customers:
    post:
      tags: [planned]
      x-status: planned
      summary: Register a customer (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid customer data

  /customers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags: [planned]
      x-status: planned
      summary: Get one customer (Build 2)
      responses:
        '200':
          description: A single customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
    put:
      tags: [planned]
      x-status: planned
      summary: Update a customer (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Customer updated
        '404':
          description: Customer not found

  /customers/{id}/cart:
    get:
      tags: [planned]
      x-status: planned
      summary: Get a customer's active cart (Build 2)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The cart with its line items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Customer or cart not found

  /customers/{id}/cart/items:
    post:
      tags: [planned]
      x-status: planned
      summary: Add an item to the cart (Build 2)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '409':
          description: Requested quantity exceeds available stock

  /customers/{id}/cart/items/{itemId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
    put:
      tags: [planned]
      x-status: planned
      summary: Update a cart item's quantity (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
      responses:
        '200':
          description: Cart item updated
        '404':
          description: Cart item not found
    delete:
      tags: [planned]
      x-status: planned
      summary: Remove an item from the cart (Build 2)
      responses:
        '204':
          description: Item removed
        '404':
          description: Cart item not found

  /orders:
    post:
      tags: [planned]
      x-status: planned
      summary: Place an order from a customer's cart (Build 2)
      description: >
        Will validate stock for each line item and calculate the total
        server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: One or more items are out of stock

  /orders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags: [planned]
      x-status: planned
      summary: Get one order (Build 2)
      responses:
        '200':
          description: A single order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
    patch:
      tags: [planned]
      x-status: planned
      summary: Update an order's status (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Status updated
        '404':
          description: Order not found

  /customers/{id}/orders:
    get:
      tags: [planned]
      x-status: planned
      summary: Get a customer's order history (Build 2)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: The customer's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /delivery-slots:
    get:
      tags: [planned]
      x-status: planned
      summary: List delivery slots, optionally by date/availability (Build 3)
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
        - in: query
          name: available
          schema:
            type: boolean
      responses:
        '200':
          description: A JSON array of delivery slots
    post:
      tags: [planned]
      x-status: planned
      summary: Create a delivery slot (Build 3)
      responses:
        '201':
          description: Delivery slot created

  /delivery-slots/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags: [planned]
      x-status: planned
      summary: Get one delivery slot (Build 3)
      responses:
        '200':
          description: A single delivery slot
        '404':
          description: Delivery slot not found
    put:
      tags: [planned]
      x-status: planned
      summary: Update a delivery slot (Build 3)
      responses:
        '200':
          description: Delivery slot updated
        '404':
          description: Delivery slot not found
    delete:
      tags: [planned]
      x-status: planned
      summary: Delete a delivery slot (Build 3)
      responses:
        '204':
          description: Delivery slot deleted
        '404':
          description: Delivery slot not found

components:
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      description: The product's numeric ID
      schema:
        type: integer
        minimum: 1
      example: 101

  responses:
    ServerError:
      description: Unexpected server or database error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 500
              message: Internal server error.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, message]
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Product 999999 not found.

    Product:
      type: object
      required: [id, name, price, unit, stock, categoryId, categoryName]
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: Whole Milk 2L
        price:
          type: number
          format: float
          example: 4.99
        unit:
          type: string
          example: each
        stock:
          type: integer
          example: 42
        categoryId:
          type: integer
          example: 2
        categoryName:
          type: string
          example: Dairy
        imageUrl:
          type: string
          nullable: true
          example: https://example.com/images/whole-milk.jpg

    ProductList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    ProductInput:
      type: object
      required: [name, price, categoryId]
      properties:
        name:
          type: string
        price:
          type: number
          format: float
        unit:
          type: string
        stock:
          type: integer
        categoryId:
          type: integer
        imageUrl:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Dairy

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 7
        firstName:
          type: string
          example: Will
        lastName:
          type: string
          example: Elveus
        email:
          type: string
          example: will@example.com
        address:
          type: string
          example: 123 Rue Principale, Saint-Jerome, QC
        phone:
          type: string
          example: 450-555-0123

    CustomerInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          format: password
        address:
          type: string
        phone:
          type: string

    CartItem:
      type: object
      properties:
        id:
          type: integer
          example: 501
        productId:
          type: integer
          example: 101
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: float
          example: 4.99

    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1

    Cart:
      type: object
      properties:
        id:
          type: integer
          example: 30
        customerId:
          type: integer
          example: 7
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: float
          example: 14.97

    OrderStatus:
      type: string
      enum: [pending, packed, out_for_delivery, delivered, cancelled]

    OrderItem:
      type: object
      properties:
        productId:
          type: integer
          example: 101
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: float
          example: 4.99

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 900
        customerId:
          type: integer
          example: 7
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
          format: float
          example: 14.97
        deliveryAddress:
          type: string
          example: 123 Rue Principale, Saint-Jerome, QC
        createdAt:
          type: string
          format: date-time
          example: '2026-09-22T14:30:00Z'

    OrderInput:
      type: object
      required: [customerId, deliveryAddress]
      properties:
        customerId:
          type: integer
        deliveryAddress:
          type: string
