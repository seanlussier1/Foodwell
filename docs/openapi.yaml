      x-current-access: bearer-session-required
      x-security-enforcement: enforced
    patch:
      tags:
      - implemented
      - Order history
      x-status: implemented
      summary: Update an order's status
      description: >
        Pending orders may be packed or cancelled. Packed orders may go out for delivery
        or be cancelled. Orders out for delivery may be delivered. Delivered and cancelled
        are terminal. Sending the current status again returns the current order without
        creating an event. Cancellation restores stock and releases slot capacity in the
        same transaction as the status change and event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Current order after the requested status change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Malformed JSON or a body that is not a JSON object
        '404':
          description: Order not found
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid transition or stock cannot be restored for a deleted product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json
