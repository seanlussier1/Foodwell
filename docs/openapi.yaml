  /delivery-options:
    get:
      operationId: get__delivery_options
      tags:
      - implemented
      x-status: implemented
      x-access: public
      x-current-access: public
      x-security-enforcement: not-required
      security: []
      summary: Look up a Canadian postal area and Foodwell delivery options
      description: 'Public read-only composite response: Zippopotam.us/GeoNames prefix lookup
        plus Foodwell configured service prefixes and future active slots with remaining capacity.
        Only the first three characters are sent externally. Full-address/full-code validity
        is not verified. No booking is made. Provider failures/unknown coverage return 200
        with status=partial, eligible=null and no offered slots. Input errors return 400.
        area.source identifies live, cached or explicit local-demo data. See DELIVERY_AREA_INTEGRATION.md
        for attribution, bounded requests, caching, configuration and PHP/JS consumer coverage.'
      parameters:
      - in: query
        name: postalCode
        required: true
        description: Canadian syntax; trim/uppercase and accept A1A1A1 or A1A 1A1. Arrays/unknown
          parameters rejected. Syntax alone does not prove the full code exists.
        schema:
          type: string
          minLength: 6
          maxLength: 7
        example: H3N 1X1
      responses:
        '200':
          description: Complete delivery-area result or explicit partial provider fallback
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAreaOptions'
        '400':
          description: Missing, invalid, array-valued or unsupported query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      description: The product's numeric ID
      schema:
        type: integer
        minimum: 1
      example: 101
  responses:
    ServerError:
      description: Unexpected server or database error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 500
              message: Internal server error.
    MalformedJson:
      description: The body is not valid JSON, or is valid JSON but not an object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 400
              message: Malformed JSON body.
              requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
    NotAcceptable:
      description: >
        The Accept header allows none of the formats this route can return
        (#33). Sent as JSON; the message lists the available formats.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 406
              message: 'Not acceptable. This route can return: application/json, application/xml, application/yaml.'
              requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
    UnsupportedMediaType:
      description: Missing or unsupported Content-Type (application/json required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 415
              message: 'This operation requires Content-Type: application/json.'
              requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - status
          - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Product 999999 not found.
            requestId:
              type: string
              description: Optional request identifier for tracing the error
    ValidationError:
      type: object
      description: 422 body. `details` maps each rejected field to its message.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - status
          - message
          - details
          properties:
            status:
              type: integer
              example: 422
            message:
              type: string
              example: Validation failed.
            details:
              type: object
              additionalProperties:
                type: string
            requestId:
              type: string
    Product:
      type: object
      description: >
        A catalog product. In XML the root element is `<product>` and a null
        value is written as an empty element with `nil="true"`.
      required:
      - id
      - name
      - price
      - unit
      - stock
      - categoryId
      - categoryName
      - imageUrl
      - isActive
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: Whole Milk 2L
        price:
          type: number
          format: float
          minimum: 0
          example: 4.99
        unit:
          type: string
          example: each
        stock:
          type: integer
          minimum: 0
          example: 42
        categoryId:
          type: integer
          example: 2
        categoryName:
          type: string
          example: Dairy
        imageUrl:
          type: string
          nullable: true
          example: https://example.com/images/whole-milk.jpg
        isActive:
          type: boolean
          description: false = deactivated (still listed, but the cart refuses it)
          example: true
      xml:
        name: product
    ProductList:
      type: object
      description: >
        One page of products. In XML: `<products><meta>...</meta><data><product>...</product></data></products>`.
      required:
      - meta
