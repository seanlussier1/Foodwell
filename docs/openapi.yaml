      description: >
        Creates an order using the customer's existing cart.
        The server validates the customer, delivery address, optional delivery
        slot, product availability and stock. Prices and the order total are
        calculated using current database prices.

        Checkout is transactional. Product stock is decreased and cart items
        are removed only after the order and its item snapshots are saved
