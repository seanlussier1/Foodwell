  status: draft-pending-Will-and-Mohamed-review
  document: SECURITY_DESIGN.md
  routeMatrix: SECURITY_ROUTE_MATRIX.md
  issue: 63
  note: security/x-access are intended permissions; x-current-access and x-security-enforcement
    distinguish the current snapshot. No runtime enforcement is added by this design.
