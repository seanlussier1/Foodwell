  /delivery-options:
    get:
      operationId: get__delivery_options
      tags:
      - implemented
      x-status: implemented
      x-access: public
      x-current-access: public
      x-security-enforcement: not-required
      security: []
      summary: Look up a Canadian postal area and Foodwell delivery options
      description: 'Public read-only composite response: Zippopotam.us/GeoNames prefix lookup
        plus Foodwell configured service prefixes and future active slots with remaining capacity.
        Only the first three characters are sent externally. Full-address/full-code validity
        is not verified. No booking is made. Provider failures/unknown coverage return 200
        with status=partial, eligible=null and no offered slots instead of passing through
        upstream 502/503 responses. Input errors return 400. The upstream lookup shares a
        five-second budget across at most two attempts, with at most two seconds to connect
        per attempt. Only transient connection failures and upstream 500, 502, 503 or 504
        responses without Retry-After can be retried. Timeouts, quota responses and invalid
        payloads are not retried. Fallback logs correlate with X-Request-ID and omit postal
        data, provider bodies and credentials. See DELIVERY_AREA_INTEGRATION.md for the
        cache, configuration, source labels and PHP/JS consumer coverage.'
      parameters:
      - in: query
        name: postalCode
        required: true
        description: Canadian syntax; trim/uppercase and accept A1A1A1 or A1A 1A1. Arrays/unknown
          parameters rejected. Syntax alone does not prove the full code exists.
        schema:
          type: string
          minLength: 6
          maxLength: 7
        example: H3N 1X1
      responses:
        '200':
          description: Complete delivery-area result or explicit partial provider fallback
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Request-ID:
              description: Correlation ID for fallback diagnostics.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAreaOptions'
        '400':
          description: Missing, invalid, array-valued or unsupported query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      description: The product's numeric ID
      schema:
        type: integer
        minimum: 1
      example: 101
  responses:
    ServerError:
      description: Unexpected server or database error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 500
              message: Internal server error.
    NegotiatedServerError:
      description: Unexpected server or database error; JSON before negotiation, otherwise the selected format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
        application/yaml:
          schema:
            $ref: '#/components/schemas/Error'
    MalformedJson:
      description: The body is not valid JSON, or is valid JSON but not an object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 400
              message: Malformed JSON body.
              requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
    NotAcceptable:
      description: >
        The Accept header allows none of the formats this route can return
        (#33). Sent as JSON; the message lists the available formats.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Missing or unsupported Content-Type (application/json required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 415
              message: 'This operation requires Content-Type: application/json.'
              requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
    Unauthorized:
      description: >
        No working login: the Authorization header is missing or is not
        "Bearer <64 hex characters>", or the session is unknown, expired,
        logged out, or belongs to a deactivated account. Nothing is changed.
      headers:
        WWW-Authenticate:
          description: Always "Bearer", telling the client to log in and send a bearer token
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 401
              message: Invalid or expired session.
              requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
    StaffOnly:
      description: >
        Logged in, but as a customer. Only staff and administrator accounts may
        do this. The check runs before the request body is read, so no
        validation details or existence hints are returned. Nothing is changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 403
              message: Forbidden.
              requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
