openapi: 3.0.3
info:
  title: Foodwell API
  version: 1.1.0-expanded-contract
  description: 'Foodwell contract: 48 operations, 32 implemented and 16 planned (tag `planned`,
    `x-status: planned`; addresses, favorites, reviews and inventory adjustments). Delivery-area
    options combine Zippopotam.us/GeoNames prefix data with configured Foodwell service areas and
    database slot availability. Every implemented operation that lists BearerSession enforces it:
    401 without a working login, 403 for the wrong account or role (see x-access). Security on
    planned operations describes the intended access only, since those routes do not exist yet.'
servers:
- url: http://localhost/foodwell-api/api/v1
  description: WampServer (Apache, www/foodwell-api)
- url: http://localhost:8080/api/v1
  description: PHP built-in server (composer start)
tags:
- name: implemented
  description: Working routes; see each operation for its implementation scope
- name: planned
  description: Contract only - not implemented yet; the route returns 404 or 405
- name: Sessions
  description: Implemented expanded resource
- name: Addresses
  description: Planned expanded resource
- name: Favorites
  description: Planned expanded resource
- name: Reviews
  description: Planned expanded resource
- name: Inventory
  description: Planned expanded resource
- name: Order history
  description: Implemented expanded resource
paths:
  /products:
    get:
      tags:
      - implemented
      x-status: implemented
      summary: List products (filter, sort, paginate)
      description: >
        Returns one page of products in a `meta` + `data` envelope (#29).
        Filters combine with AND. With no `sort`, products are ordered by ID
        (Build 1 order); every sort ends with the product ID as a unique
        tie-breaker, so pages never overlap. An empty result, or a page past
        the last one, is still 200 with `"data": []`. `next`/`previous` are
        relative links that keep every filter, the sort and the limit, and are
        null when that page does not exist. Invalid values, unknown or
        misspelled parameters (e.g. `Sort`) and repeated parameters (e.g.
        `sort=price&sort=name`, which PHP would otherwise reduce to the last
        value) return 400 (#41). Inactive products are included (see
        `isActive`).


        **Formats (#33):** JSON (default), XML or YAML, chosen with the
        `Accept` header; anything else returns 406. See
        docs/REPRESENTATION_MATRIX.md.
      parameters:
      - in: query
        name: category
        description: Only products in this category ID. An ID with no products returns an empty page.
        schema:
          type: integer
          minimum: 1
          maximum: 4294967295
        example: 2
      - in: query
        name: search
        description: >
          Case-insensitive text contained in the product name. Trimmed;
          blank means no search. `%` and `_` are matched literally.
        schema:
          type: string
          maxLength: 100
        example: milk
      - in: query
        name: sort
        description: >
          Sort order; a leading `-` means descending. Omitted = by ID ascending.
        schema:
          type: string
          enum: [name, -name, price, -price]
        example: -price
      - in: query
        name: page
        description: Page number (1 = first page).
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - in: query
        name: limit
        description: Products per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: One page of products (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
              examples:
                filtered:
                  summary: Dairy products containing "ch", sorted by price, 1 per page
                  value:
                    meta:
                      page: 1
                      limit: 1
                      total: 1
                      totalPages: 1
                      next: null
                      previous: null
                    data:
                    - id: 102
                      name: Old Cheddar 400g
                      price: 7.49
                      unit: each
                      stock: 25
                      categoryId: 2
                      categoryName: Dairy
                      imageUrl: https://example.com/images/old-cheddar.jpg
                      isActive: true
                middlePage:
                  summary: Page 2 of the Dairy category, 1 per page, with links that keep the filter
                  value:
                    meta:
                      page: 2
                      limit: 1
                      total: 3
                      totalPages: 3
                      next: /api/v1/products?category=2&page=3&limit=1
                      previous: /api/v1/products?category=2&page=1&limit=1
                    data:
                    - id: 102
                      name: Old Cheddar 400g
                      price: 7.49
                      unit: each
                      stock: 25
                      categoryId: 2
                      categoryName: Dairy
                      imageUrl: https://example.com/images/old-cheddar.jpg
                      isActive: true
                empty:
                  summary: No matches
                  value:
                    meta:
                      page: 1
                      limit: 10
                      total: 0
                      totalPages: 0
                      next: null
                      previous: null
                    data: []
            application/xml:
              schema:
                $ref: '#/components/schemas/ProductList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          description: >
            Invalid query parameter (for example page=0, limit=500, sort=stock,
            category=abc), an unknown parameter, or a parameter given more
            than once. All problems are listed in one message. Sent in the
            negotiated format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 400
                  message: 'Invalid query parameters: limit must be a whole number from 1 to 100.'
                  requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/NegotiatedServerError'
      operationId: get__products
      x-access: public
      security: []
      x-current-access: public
      x-security-enforcement: not-required
    post:
      tags:
      - implemented
      x-status: implemented
      summary: Create a product
      description: >
        Creates a product from a JSON object (#27). `stock` is the opening
        balance; later stock changes use inventory adjustments. Names and units
        are trimmed. Unknown fields are rejected. Rejected requests change
        nothing. Requires a staff or administrator login (#40): no login gives
        401, a customer login gives 403.
        Request and response bodies are JSON only (XML/YAML deferred to #65).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            example:
              name: Oat Milk 1L
              price: 3.49
              unit: each
              stock: 20
              categoryId: 2
      responses:
        '201':
          description: Product created; the body is the saved product read back from the database
          headers:
            Location:
              description: Path of the new product
              schema:
                type: string
              example: /api/v1/products/111
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 111
                name: Oat Milk 1L
                price: 3.49
                unit: each
                stock: 20
                categoryId: 2
                categoryName: Dairy
                imageUrl: null
                isActive: true
        '400':
          $ref: '#/components/responses/MalformedJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Invalid fields (including a category that does not exist); nothing is saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error:
                  status: 422
                  message: Validation failed.
                  details:
                    price: Price cannot be negative.
                    categoryId: This category does not exist.
                    color: This field is not allowed for this operation.
                  requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: post__products
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: bearer-session-required
      x-security-enforcement: enforced
  /products/{id}:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    get:
      tags:
      - implemented
      x-status: implemented
      summary: Get one product by ID
      description: >
        **Formats (#33):** JSON (default), XML or YAML, chosen with the
        `Accept` header; anything else returns 406. Errors use the same format.
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 101
                name: Whole Milk 2L
                price: 4.99
                unit: each
                stock: 42
                categoryId: 2
                categoryName: Dairy
                imageUrl: https://example.com/images/whole-milk.jpg
                isActive: true
            application/xml:
              schema:
                $ref: '#/components/schemas/Product'
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <product>
                  <id>101</id>
                  <name>Whole Milk 2L</name>
                  <price>4.99</price>
                  <unit>each</unit>
                  <stock>42</stock>
                  <categoryId>2</categoryId>
                  <categoryName>Dairy</categoryName>
                  <imageUrl>https://example.com/images/whole-milk.jpg</imageUrl>
                  <isActive>true</isActive>
                </product>
            application/yaml:
              schema:
                $ref: '#/components/schemas/Product'
              example: |
                id: 101
                name: "Whole Milk 2L"
                price: 4.99
                unit: "each"
                stock: 42
                categoryId: 2
                categoryName: "Dairy"
                imageUrl: "https://example.com/images/whole-milk.jpg"
                isActive: true
        '404':
          description: No product with that ID (sent in the negotiated format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 404
                  message: Product 999999 not found.
                  requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/NegotiatedServerError'
      operationId: get__products__id_
      x-access: public
      security: []
      x-current-access: public
      x-security-enforcement: not-required
    put:
      tags:
      - implemented
      x-status: implemented
      summary: Replace a product's details
      description: >
        Replaces name, price, unit, category and image (#27). **Stock cannot be
        changed here** (422): it only changes through inventory adjustments.
        Omitted optional fields reset to their defaults (unit "each", imageUrl
        null), except `isActive`, which keeps its current value when omitted.
        Send `"isActive": false` to deactivate a product (the cart then refuses
        it). Rejected requests change nothing. Requires a staff or administrator
        login (#40). JSON only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
            example:
              name: Gala Apples
              price: 3.19
              unit: lb
              categoryId: 1
              imageUrl: null
      responses:
        '200':
          description: Product updated; the body is the saved product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '404':
          description: No product with that ID (checked before the body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Invalid fields, a category that does not exist, or `stock` in the body; nothing is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error:
                  status: 422
                  message: Validation failed.
                  details:
                    stock: Stock cannot be changed here. Use an inventory adjustment.
                  requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: put__products__id_
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: bearer-session-required
      x-security-enforcement: enforced
    delete:
      tags:
      - implemented
      x-status: implemented
      summary: Delete a product
      description: >
        Deletes a product with no inventory history. The database then removes
        its cart lines, favorites and reviews, and keeps past order lines with
        productId set to null (purchase snapshots stay readable). A product with
        inventory history cannot be deleted (409); deactivate it with PUT
        `"isActive": false` instead. Requires a staff or administrator login (#40).
      responses:
        '204':
          description: Product deleted (no body)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '404':
          description: No product with that ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: The product has inventory history; nothing is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 409
                  message: 'Product 109 has inventory history and cannot be deleted. Deactivate it instead with PUT and "isActive": false.'
                  requestId: 3f2a9c4e1b7d4a6f8e0c5b2d9a1f7e3c
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: delete__products__id_
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: bearer-session-required
      x-security-enforcement: enforced
  /categories:
    get:
      tags:
      - implemented
      x-status: implemented
      summary: Get all categories
      responses:
        '200':
          description: The category list (possibly empty)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          $ref: '#/components/responses/NotAcceptable'
      operationId: get__categories
      security: []
      x-access: public
      x-current-access: public
      x-security-enforcement: not-required
    post:
      tags:
      - implemented
      x-status: implemented
      summary: Add a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Malformed JSON or the request body is not a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The request Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Category name validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: post__categories
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: bearer-session-required
      x-security-enforcement: enforced
  /categories/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
    get:
      tags:
      - implemented
      x-status: implemented
      summary: Get one category by ID
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          $ref: '#/components/responses/NotAcceptable'
      operationId: get__categories__id_
      security: []
      x-access: public
      x-current-access: public
      x-security-enforcement: not-required
    delete:
      tags:
      - implemented
      x-status: implemented
      summary: Delete a category
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Category deleted successfully.
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StaffOnly'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: Cannot delete a category that still has products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: delete__categories__id_
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: bearer-session-required
      x-security-enforcement: enforced
  /customers:
    post:
      tags:
      - implemented
      x-status: implemented
      summary: Register a customer
      description: JSON registration only. Email is trimmed and lowercased. Passwords are
        hashed; role and activation are assigned by the server. Unknown fields are rejected.
        Log in afterwards with POST /auth/sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationInput'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Malformed JSON or a body other than a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account with this normalized email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Missing or unsupported Content-Type (application/json required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid registration fields; no customer is created
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                        example: 422
                      message:
                        type: string
                        example: Validation failed.
                      details:
                        type: object
                        additionalProperties:
                          type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: post__customers
      security: []
      x-access: public
      x-current-access: public
      x-security-enforcement: not-required
    get:
      tags:
      - implemented
      x-status: implemented
      operationId: get__customers
      summary: Filter and paginate customers
      description: Requires a staff or administrator login. Returns customer-role accounts
        only, ordered by ID ascending. Both filters combine with AND. Empty and beyond-final
        pages return 200 with empty data. Unknown or array-valued query parameters are rejected.
      security:
      - BearerSession: []
      x-access: staff_or_admin
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 2147483647
        description: Positive decimal integer; no signs, leading zeroes or fractions
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
        description: Trimmed case-insensitive literal substring in first or last name; blank
          means no name filter
      - in: query
        name: isActive
        schema:
          type: boolean
        description: Accepts exactly true or false; omit for both activation states
      responses:
        '200':
          description: Filtered customer collection, including empty results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
        '400':
          description: Invalid pagination, filters or unknown query parameters; error.details
            identifies fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: Invalid query parameters.
                      details:
                        type: object
                        additionalProperties:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Logged in, but not as staff or an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'
      x-current-access: bearer-session-required
      x-security-enforcement: enforced
  /customers/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
    get:
      tags:
      - implemented
      x-status: implemented
      summary: Get a customer profile
      responses:
        '200':
          description: A single customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Logged in, but not as this customer or an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer ID not found or outside the supported ID range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get__customers__id_
      security:
      - BearerSession: []
      x-access: owner_or_admin
      description: Requires a login as this customer or an administrator. Returns the
        profile without password or session data.
      x-current-access: bearer-session-required
      x-security-enforcement: enforced
    put:
      tags:
      - implemented
      x-status: implemented
      summary: Update a customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Malformed JSON or non-object body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Logged in, but not as this customer or an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer ID not found or outside the supported ID range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: Normalized email belongs to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Missing or unsupported Content-Type; application/json required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid profile fields; nothing is changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                        example: 422
                      message:
                        type: string
                        example: Validation failed.
                      details:
                        type: object
                        additionalProperties:
                          type: string
        '500':
          $ref: '#/components/responses/ServerError'
