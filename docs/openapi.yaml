          maxLength: 150
          description: Trimmed; cannot be blank
        price:
          type: number
          format: float
          minimum: 0
          maximum: 999999.99
          description: A JSON number (not a string), at most 2 decimals
        unit:
          type: string
          minLength: 1
          maxLength: 30
          default: each
          description: Omitted = "each"
        categoryId:
          type: integer
          minimum: 1
          description: Must be an existing category
        imageUrl:
          type: string
          nullable: true
          maxLength: 255
          description: An http or https URL, or null. Omitted = null
        isActive:
          type: boolean
          description: Omitted = keep the current value
      additionalProperties: false
    DeliverySlotInput:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 with Z or +hh:mm; stored in UTC. Future, at most 365 days ahead.
          example: '2026-11-20T19:00:00Z'
        endsAt:
          type: string
          format: date-time
          description: After startsAt, at most 12 hours later
          example: '2026-11-20T21:00:00Z'
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of non-cancelled orders
        isActive:
          type: boolean
          description: POST default true; PUT omitted = keep the current value
      required:
      - startsAt
      - endsAt
      - capacity
      additionalProperties: false
    DeliverySlot:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
        startsAt:
          type: string
          format: date-time
          description: UTC
          example: '2026-11-20T19:00:00Z'
        endsAt:
          type: string
          format: date-time
          description: UTC
          example: '2026-11-20T21:00:00Z'
        capacity:
          type: integer
          minimum: 1
        bookedCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Orders using this slot that are not cancelled
        availableCapacity:
          type: integer
          minimum: 0
          readOnly: true
          description: capacity - bookedCount (never below 0)
        isAvailable:
          type: boolean
          readOnly: true
          description: Active, starts in the future and availableCapacity > 0, so checkout accepts it now
        isActive:
          type: boolean
        createdAt:
          type: string
          readOnly: true
          example: '2026-11-17 18:20:05'
        updatedAt:
          type: string
          readOnly: true
          example: '2026-11-17 18:20:05'
      required:
      - id
      - startsAt
      - endsAt
      - capacity
      - bookedCount
      - availableCapacity
      - isAvailable
      - isActive
      - createdAt
      - updatedAt
    CartQuantityInput:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
      required:
      - quantity
      additionalProperties: false
    AddressList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
      - data
    ReviewList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
      required:
      - data
    FavoriteList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Favorite'
      required:
      - data
    InventoryAdjustmentList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryAdjustment'
      required:
      - data
    OrderStatusEventList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusEvent'
      required:
      - data
    DeliverySlotList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeliverySlot'
      required:
      - data
    CustomerListItem:
      allOf:
      - $ref: '#/components/schemas/Customer'
      - type: object
        required:
        - isActive
        properties:
          isActive:
            type: boolean
    CustomerCollection:
      type: object
      required:
      - metadata
      - data
      properties:
        metadata:
          type: object
          required:
          - page
          - limit
          - total
          - totalPages
          - next
          - previous
          properties:
            page:
              type: integer
              minimum: 1
              maximum: 2147483647
            limit:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
              description: Matching customer-role accounts, excluding staff/admin
            totalPages:
              type: integer
              minimum: 0
            next:
              type: string
              nullable: true
              description: Relative URL preserving filters and limit, or null
            previous:
              type: string
              nullable: true
              description: Relative URL; beyond-final pages link back to final page; null
                when empty or first page
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerListItem'
    CustomerDeactivationInput:
      type: object
      additionalProperties: false
      required:
      - isActive
      properties:
        isActive:
          type: boolean
          enum:
          - false
          description: Only false is supported; this endpoint cannot reactivate accounts
    DeliveryAreaOptions:
      type: object
      required:
      - status
      - postalCode
      - area
      - delivery
      - sources
      - notice
      - warnings
      properties:
        status:
          type: string
          enum:
          - complete
          - partial
        postalCode:
          type: string
          example: H3N 1X1
        area:
          type: object
          required:
          - prefix
          - lookupStatus
          - places
          - source
          - fetchedAt
          properties:
            prefix:
              type: string
              example: H3N
            lookupStatus:
              type: string
              enum:
              - found
              - not-found
              - unavailable
            places:
              type: array
              maxItems: 50
              items:
                type: object
                required:
                - name
                - province
                - provinceCode
                properties:
                  name:
                    type: string
                  province:
                    type: string
                  provinceCode:
                    type: string
            source:
              type: string
              enum:
              - live
              - cache
              - demo
              - unavailable
            fetchedAt:
              type: string
              format: date-time
              nullable: true
        delivery:
          type: object
          required:
          - eligible
          - status
          - slots
          - bookingConfirmed
          properties:
            eligible:
              type: boolean
              nullable: true
              description: Null when coverage/provider failure prevents confirmation
            status:
              type: string
              enum:
              - available
              - no-slots
              - outside-area
              - unknown
            slots:
              type: array
              maxItems: 10
              items:
                type: object
                required:
                - id
                - startsAt
                - endsAt
                - remainingCapacity
                properties:
                  id:
                    type: integer
                  startsAt:
                    type: string
                    format: date-time
                  endsAt:
                    type: string
                    format: date-time
                  remainingCapacity:
                    type: integer
                    minimum: 1
            bookingConfirmed:
              type: boolean
              enum:
              - false
        sources:
          type: object
          required:
          - internal
          - external
          - providerUrl
          - dataUrl
          - licenseUrl
          properties:
            internal:
              type: string
            external:
              type: string
            providerUrl:
              type: string
              format: uri
            dataUrl:
              type: string
              format: uri
            licenseUrl:
              type: string
              format: uri
        notice:
          type: string
        warnings:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
  securitySchemes:
    BearerSession:
      type: http
      scheme: bearer
      description: Opaque 256-bit random bearer session; only the SHA-256 token digest
        is stored. Session endpoints validate expiry, revocation and account activity;
        authorization of other routes is tracked in issue 46. This declaration does not enforce
        access.
x-cors:
  configuration: 'CORS_ALLOWED_ORIGINS: comma-separated allowed browser origins; same-origin
    requests also accepted'
  defaultOrigins:
  - http://localhost:8081
  - http://127.0.0.1:8081
  preflight: OPTIONS returns 204 before database access; supports GET, POST, PUT, PATCH, DELETE,
    OPTIONS and Accept, Content-Type, Authorization headers. Disallowed origins return 403;
    unsupported preflight methods 405; unsupported preflight headers 400.
