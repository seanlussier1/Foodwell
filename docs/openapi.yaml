          description: Cart item updated
        '404':
          description: Cart item not found
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: put__customers__id__cart_items__itemId_
      security:
      - BearerSession: []
      x-access: owner_or_admin
    delete:
      tags:
      - planned
      x-status: planned
      summary: Remove an item from the cart (Build 2)
      responses:
        '204':
          description: Item removed
        '404':
          description: Cart item not found
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: delete__customers__id__cart_items__itemId_
      security:
      - BearerSession: []
      x-access: owner_or_admin
  /orders:
    post:
      tags:
