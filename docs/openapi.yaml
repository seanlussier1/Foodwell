openapi: 3.0.3
info:
  title: Foodwell API
  version: 1.1.0-expanded-contract
  description: 'Foodwell contract: 48 operations. Delivery-area options combine Zippopotam.us/GeoNames
    prefix data with configured Foodwell service areas and database slot availability. Customer/cart
    management remain local demos; intended role/ownership enforcement is still planned. See
    per-operation implementation/access metadata.'
servers:
- url: http://localhost/foodwell-api/api/v1
  description: WampServer (Apache, www/foodwell-api)
- url: http://localhost:8080/api/v1
  description: PHP built-in server (composer start)
tags:
- name: implemented
  description: Working routes; see each operation for its implementation scope
- name: planned
  description: Contract only - not implemented yet (Build 2 / Build 3)
- name: Sessions
  description: Planned expanded resource
- name: Addresses
  description: Planned expanded resource
- name: Favorites
  description: Planned expanded resource
- name: Reviews
  description: Planned expanded resource
- name: Inventory
  description: Planned expanded resource
- name: Order history
  description: Planned expanded resource
paths:
  /products:
    get:
      tags:
      - implemented
      x-status: implemented
      summary: Get the list of products
      description: 'Returns every product from the database, wrapped in a `data` envelope.
        No filtering, sorting or pagination in Build 1. When there are no products the response
        is still `200` with `{"data": []}`.

        '
      responses:
        '200':
          description: The product list (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
              examples:
                populated:
                  summary: Seeded database
                  value:
                    data:
                    - id: 101
                      name: Whole Milk 2L
                      price: 4.99
                      unit: each
                      stock: 42
                      categoryId: 2
                      categoryName: Dairy
                      imageUrl: https://example.com/images/whole-milk.jpg
                    - id: 104
                      name: Gala Apples
                      price: 2.99
                      unit: lb
                      stock: 120
                      categoryId: 1
                      categoryName: Produce
                      imageUrl: https://example.com/images/gala-apples.jpg
                empty:
                  summary: No products in the database
                  value:
                    data: []
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get__products
      x-access: public
      security: []
      x-current-access: public
      x-security-enforcement: not-required
    post:
      tags:
      - planned
      x-status: planned
      summary: Add a new product (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product data
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post__products
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: not-implemented
      x-security-enforcement: planned
  /products/{id}:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    get:
      tags:
      - implemented
      x-status: implemented
      summary: Get one product by ID
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 101
                name: Whole Milk 2L
                price: 4.99
                unit: each
                stock: 42
                categoryId: 2
                categoryName: Dairy
                imageUrl: https://example.com/images/whole-milk.jpg
        '404':
          description: No product with that ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 404
                  message: Product 999999 not found.
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get__products__id_
      x-access: public
      security: []
      x-current-access: public
      x-security-enforcement: not-required
    put:
      tags:
      - planned
      x-status: planned
      summary: Replace a product's details (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Product updated
        '404':
          description: Product not found
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Stock changes use inventory-adjustment resources. Deactivate products with
        audit history instead of deleting them.
      operationId: put__products__id_
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: not-implemented
      x-security-enforcement: planned
    delete:
      tags:
      - planned
      x-status: planned
      summary: Delete a product (Build 2)
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: delete__products__id_
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: not-implemented
      x-security-enforcement: planned
  /categories:
    get:
      tags:
      - implemented
      x-status: implemented
      summary: Get all categories
      responses:
        '200':
          description: The category list (possibly empty)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get__categories
      security: []
      x-access: public
      x-current-access: public
      x-security-enforcement: not-required
    post:
      tags:
      - implemented
      x-status: implemented
      summary: Add a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Malformed JSON or the request body is not a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The request Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Category name validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: post__categories
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: public
      x-security-enforcement: planned
      x-security-note: 'Current category writes have no authentication/role checks. Staff/admin
        permission is intended under #46; controlled local synthetic development only until
        enforced.'
  /categories/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
    get:
      tags:
      - implemented
      x-status: implemented
      summary: Get one category by ID
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get__categories__id_
      security: []
      x-access: public
      x-current-access: public
      x-security-enforcement: not-required
    delete:
      tags:
      - implemented
      x-status: implemented
      summary: Delete a category
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                    example: Category deleted successfully.
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot delete a category that still has products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: delete__categories__id_
      security:
      - BearerSession: []
      x-access: staff_or_admin
      x-current-access: public
      x-security-enforcement: planned
      x-security-note: 'Current category writes have no authentication/role checks. Staff/admin
        permission is intended under #46; controlled local synthetic development only until
        enforced.'
  /customers:
    post:
      tags:
      - implemented
      x-status: implemented
      summary: Register a customer
      description: JSON registration only. Email is trimmed and lowercased. Passwords are
        hashed; role and activation are assigned by the server. Unknown fields are rejected.
        Profile reads/updates and sessions remain planned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationInput'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Malformed JSON or a body other than a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account with this normalized email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Missing or unsupported Content-Type (application/json required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id003
          description: Invalid registration fields; no customer is created
          content: &id001
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                        example: 422
                      message:
                        type: string
                        example: Validation failed.
                      details:
                        type: object
                        additionalProperties:
                          type: string
      operationId: post__customers
      security: []
      x-access: public
      x-current-access: public
      x-security-enforcement: not-required
    get:
      tags:
      - implemented
      x-status: local-demo
      operationId: get__customers
      summary: Filter and paginate customers (local demo)
      description: Requires APP_CUSTOMER_PROFILE_DEMO=1 and loopback access; otherwise 403.
        Intended staff/admin authorization is not implemented. Returns customer-role accounts
        only, ordered by ID ascending. Both filters combine with AND. Empty and beyond-final
        pages return 200 with empty data. Unknown or array-valued query parameters are rejected.
        No customer listing authentication is claimed.
      security:
      - BearerSession: []
      x-access: staff_or_admin
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 2147483647
        description: Positive decimal integer; no signs, leading zeroes or fractions
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
        description: Trimmed case-insensitive literal substring in first or last name; blank
          means no name filter
      - in: query
        name: isActive
        schema:
          type: boolean
        description: Accepts exactly true or false; omit for both activation states
      responses:
        '200':
          description: Filtered customer collection, including empty results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
        '400':
          description: Invalid pagination, filters or unknown query parameters; error.details
            identifies fields
          content: *id001
        '403':
          description: Local demo disabled or request not from loopback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-current-access: local-demo-only
      x-security-enforcement: planned
  /customers/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
    get:
      tags:
      - implemented
      x-status: local-demo
      summary: Get a customer profile (local demo)
      responses:
        '200':
          description: A single customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer ID not found or outside the supported ID range
          content: &id002
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Local demo is disabled or client is not loopback; future owner/admin
            enforcement remains planned
          content: *id002
      operationId: get__customers__id_
      security:
      - BearerSession: []
      x-access: owner_or_admin
      description: 'Requires APP_CUSTOMER_PROFILE_DEMO=1 and a loopback client address. Otherwise
        returns 403. This is a local synthetic-data demo without authentication; owner/admin
        session enforcement is planned under #45/#46. BearerSession below documents the intended
        future access contract, not implemented security.'
      x-current-access: local-demo-only
      x-security-enforcement: planned
    put:
      tags:
      - implemented
      x-status: local-demo
      summary: Update a customer profile (local demo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer ID not found or outside the supported ID range
          content: *id002
        '403':
          description: Local demo is disabled or client is not loopback; future owner/admin
            enforcement remains planned
          content: *id002
        '400':
          description: Malformed JSON or non-object body
          content: *id002
        '409':
          description: Normalized email belongs to another account
          content: *id002
        '415':
          description: Missing or unsupported Content-Type; application/json required
          content: *id002
        '422': *id003
      operationId: put__customers__id_
      security:
      - BearerSession: []
      x-access: owner_or_admin
      description: 'Requires APP_CUSTOMER_PROFILE_DEMO=1 and a loopback client address. Otherwise
        returns 403. This is a local synthetic-data demo without authentication; owner/admin
        session enforcement is planned under #45/#46. BearerSession below documents the intended
        future access contract, not implemented security. Replaces profile fields; omitted
        address/phone become null. Password, role and activation cannot be changed. Missing
        required fields are invalid.'
      x-current-access: local-demo-only
      x-security-enforcement: planned
    patch:
      tags:
      - implemented
      x-status: local-demo
      operationId: patch__customers__id_
      summary: Deactivate a customer (local demo)
      description: Requires explicit local demo flag and loopback address. Intended staff/admin
        enforcement remains planned. Only customer-role accounts can be deactivated. Profile/history
        records are retained and existing sessions are revoked atomically. Repeated deactivation
        returns 200. No reactivation or arbitrary field patching is supported.
      security:
      - BearerSession: []
      x-access: staff_or_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDeactivationInput'
      responses:
        '200':
          description: Deactivated customer; isActive is false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListItem'
        '400':
          description: Malformed or non-object JSON
          content: &id004
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Demo disabled, non-loopback request, or target is staff/admin
          content: *id004
        '404':
          description: Customer not found
          content: *id004
        '415':
          description: Missing or unsupported Content-Type; application/json required
          content: *id004
        '422': *id003
      x-current-access: local-demo-only
      x-security-enforcement: planned
  /customers/{id}/cart:
    get:
      tags:
      - implemented
      x-status: local-demo
      summary: Get a customer's active cart (Build 2)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Current cart, possibly empty
          content: &id006
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Customer, product or scoped cart item does not exist, as applicable
          content: &id005
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Local demo disabled, non-loopback caller, or target account inactive/non-customer
          content: *id005
      operationId: get__customers__id__cart
      security:
      - BearerSession: []
      x-access: owner_or_admin
      x-current-access: local-demo-only
      x-security-enforcement: planned
      description: 'Requires APP_CART_DEMO=1 and a loopback client address. This is not authentication
        or owner/admin enforcement. The path customer must exist, be active and have the customer
        role. All cart-item IDs are scoped to that customer cart. Prices/subtotals are server-calculated
        from the current catalog; cart edits do not reserve stock. Session ownership checks
        remain #45/#46 work. GET is read-only. An account without a persisted cart receives
        an empty cart with id=null; no cart row is created.'
  /customers/{id}/cart/items:
    post:
      tags:
      - implemented
      x-status: local-demo
      summary: Add an item to the cart (Build 2)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
      responses:
        '201':
          description: New product line added; creates the reusable cart if needed
          content: *id006
        '409':
          description: Product inactive, unavailable stock, or combined quantity exceeds the
            per-line maximum; no cart change is committed
          content: *id005
        '403':
          description: Local demo disabled, non-loopback caller, or target account inactive/non-customer
          content: *id005
        '404':
          description: Customer, product or scoped cart item does not exist, as applicable
          content: *id005
        '200':
          description: Updated cart; POST increased an existing product line
          content: *id006
        '400':
          description: Malformed JSON or body is not an object
          content: *id005
        '415':
          description: Missing or unsupported Content-Type; application/json required
          content: *id005
        '422': *id003
      operationId: post__customers__id__cart_items
      security:
      - BearerSession: []
      x-access: owner_or_admin
      x-current-access: local-demo-only
      x-security-enforcement: planned
      description: 'Requires APP_CART_DEMO=1 and a loopback client address. This is not authentication
        or owner/admin enforcement. The path customer must exist, be active and have the customer
        role. All cart-item IDs are scoped to that customer cart. Prices/subtotals are server-calculated
        from the current catalog; cart edits do not reserve stock. Session ownership checks
        remain #45/#46 work. POST adds quantity to an existing line; the combined quantity
        must pass stock checks. POST is not idempotent and must not be blindly retried after
        an uncertain response.'
  /customers/{id}/cart/items/{itemId}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
    - in: path
      name: itemId
      required: true
      schema:
        type: integer
    put:
      tags:
      - implemented
      x-status: local-demo
      summary: Update a cart item's quantity (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartQuantityInput'
      responses:
        '200':
          description: Updated cart with absolute quantity
          content: *id006
        '404':
          description: Customer, product or scoped cart item does not exist, as applicable
          content: *id005
        '403':
          description: Local demo disabled, non-loopback caller, or target account inactive/non-customer
          content: *id005
        '400':
          description: Malformed JSON or body is not an object
          content: *id005
        '415':
          description: Missing or unsupported Content-Type; application/json required
          content: *id005
        '422': *id003
        '409':
          description: Product inactive, unavailable stock, or combined quantity exceeds the
            per-line maximum; no cart change is committed
          content: *id005
      operationId: put__customers__id__cart_items__itemId_
      security:
      - BearerSession: []
      x-access: owner_or_admin
      x-current-access: local-demo-only
      x-security-enforcement: planned
      description: 'Requires APP_CART_DEMO=1 and a loopback client address. This is not authentication
        or owner/admin enforcement. The path customer must exist, be active and have the customer
        role. All cart-item IDs are scoped to that customer cart. Prices/subtotals are server-calculated
        from the current catalog; cart edits do not reserve stock. Session ownership checks
        remain #45/#46 work. PUT replaces the line quantity; it cannot change the product.
        Repeating an unchanged valid PUT succeeds.'
    delete:
      tags:
      - implemented
      x-status: local-demo
      summary: Remove an item from the cart (Build 2)
      responses:
        '204':
          description: Item removed; no response body
        '404':
          description: Customer, product or scoped cart item does not exist, as applicable
          content: *id005
        '403':
          description: Local demo disabled, non-loopback caller, or target account inactive/non-customer
          content: *id005
      operationId: delete__customers__id__cart_items__itemId_
      security:
      - BearerSession: []
      x-access: owner_or_admin
      x-current-access: local-demo-only
      x-security-enforcement: planned
      description: 'Requires APP_CART_DEMO=1 and a loopback client address. This is not authentication
        or owner/admin enforcement. The path customer must exist, be active and have the customer
        role. All cart-item IDs are scoped to that customer cart. Prices/subtotals are server-calculated
        from the current catalog; cart edits do not reserve stock. Session ownership checks
        remain #45/#46 work. DELETE returns 204 without a response body. Repeating removal
        of a missing item returns 404. Inactive/out-of-stock product lines may still be removed.
        An emptied cart row is retained for reuse.'
  /orders:
    post:
      tags:
      - planned
      x-status: planned
      summary: Place an order from a customer's cart (Build 2)
      description: 'Will validate stock for each line item and calculate the total server-side.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: One or more items are out of stock
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post__orders
      security:
      - BearerSession: []
      x-access: owner_or_admin
      x-current-access: not-implemented
      x-security-enforcement: planned
  /orders/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
    get:
      tags:
      - planned
      x-status: planned
      summary: Get one order (Build 2)
      responses:
        '200':
          description: A single order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get__orders__id_
      security:
      - BearerSession: []
      x-access: owner_or_admin
      x-current-access: not-implemented
      x-security-enforcement: planned
    patch:
      tags:
      - planned
      x-status: planned
      summary: Update an order's status (Build 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
